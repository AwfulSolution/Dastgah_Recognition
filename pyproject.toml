[project]
name = "dastgah"
version = "0.1.0"
description = "Dastgah and Avaz classification for Persian classical music audio"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.11",
    "soundfile>=0.12",
    "pandas>=2.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dastgah = "dastgah.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dastgah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
